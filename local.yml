---
- name: Správa stanice Linux Mint
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - group_vars/mint.yml
  vars:
    station_id: "{{ station_id_content.content | b64decode | trim }}"
  pre_tasks:
    - name: Zjistit přítomnost identity stanice
      ansible.builtin.stat:
        path: /etc/ansible/station-id
      register: station_id_file

    - name: Ověřit přítomnost identity stanice
      ansible.builtin.assert:
        that:
          - station_id_file.stat.exists
        fail_msg: Chybí /etc/ansible/station-id; nejprve spusťte bootstrap.sh <id>.

    - name: Načíst identitu stanice
      ansible.builtin.slurp:
        src: /etc/ansible/station-id
      register: station_id_content

    - name: Ověřit, že cílový systém je Linux Mint
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Linux Mint'
        fail_msg: Tato konfigurace je určena pouze pro Linux Mint.

    - name: Ověřit identitu stanice
      ansible.builtin.assert:
        that:
          - station_id in station_ids
        fail_msg: Identita stanice chybí nebo není povolená.

    - name: Zjistit dřívější instalaci Guardiana v opt
      ansible.builtin.stat:
        path: /opt/upgrade-guardian
      register: guardian_opt_dir

    - name: Zjistit dřívější konfiguraci Guardiana
      ansible.builtin.stat:
        path: /etc/upgrade-guardian
      register: guardian_etc_dir

    - name: Zjistit dřívější systemd unit Guardiana
      ansible.builtin.stat:
        path: /etc/systemd/system/upgrade-guardian.service
      register: guardian_unit_file

    - name: Zjistit dřívější data Guardiana
      ansible.builtin.stat:
        path: /var/lib/upgrade-guardian
      register: guardian_var_dir

    - name: Načíst konfiguraci stanice
      ansible.builtin.include_vars:
        file: "host_vars/{{ station_id }}.yml"
        name: station_config

    - name: Nastavit větev příštího ověřeného pullu
      ansible.builtin.lineinfile:
        path: /etc/ansible/ansible-pull.env
        regexp: '^ANSIBLE_CONFIG_BRANCH='
        line: "ANSIBLE_CONFIG_BRANCH={{ station_config.ansible_pull_branch | default('main') }}"
        create: true
        owner: root
        group: root
        mode: '0644'

    - name: Ověřit zabezpečenou age identitu před SOPS lookupem
      ansible.builtin.stat:
        path: /etc/ansible/age.key
      register: ansible_age_key

    - name: Vyžadovat root-only age identitu před SOPS lookupem
      ansible.builtin.assert:
        that:
          - ansible_age_key.stat.exists
          - ansible_age_key.stat.pw_name == 'root'
          - ansible_age_key.stat.gr_name == 'root'
          - ansible_age_key.stat.mode == '0600'
        fail_msg: Chybí zabezpečený /etc/ansible/age.key (root:root 0600); nejprve obnovte nebo bootstrapujte identitu.

    - name: Načíst šifrovaná tajemství stanice
      ansible.builtin.set_fact:
        station_secrets: >-
          {{ lookup(
            'community.sops.sops',
            playbook_dir ~ '/secrets/' ~ station_id ~ '.enc.yaml',
            input_type='yaml',
            output_type='yaml'
          ) | from_yaml }}
      no_log: true

    - name: Ověřit povinná tajemství
      ansible.builtin.assert:
        that:
          - station_secrets.SMTP_RELAY_HOST is defined
          - station_secrets['SMTP_PASS_' ~ (station_id | upper | replace('-', '_'))] is defined
          - station_secrets.USER_EMAIL is defined
          - station_secrets.ADMIN_EMAIL is defined
          - station_secrets.SMTP_ACCOUNT is defined
          - station_secrets.ADMIN_SIGNATURE is defined
        fail_msg: Šifrovaný soubor stanice neobsahuje všechna povinná pole.
      no_log: true
  roles:
    - common
    - role: base_tools
      base_tools_enabled: "{{ station_config.base_tools_enabled | default(true) }}"
      base_tools_extra_packages: "{{ station_config.base_tools_extra_packages | default([]) }}"
    - role: station_base
      station_base_absent_packages: "{{ station_config.station_base_absent_packages | default([]) }}"
    - role: teamviewer
      teamviewer_enabled: "{{ station_config.teamviewer_enabled | default(false) }}"
    - sops_client
    - mail
    - smartd
    - reporting
    - inventory
    - role: hwinfo
      hwinfo_enabled: "{{ station_config.hwinfo_enabled | default(false) }}"
      hwinfo_install_inxi: "{{ station_config.hwinfo_install_inxi | default(false) }}"
      hwinfo_station_id: "{{ station_id }}"
      hwinfo_sudo_user: "{{ station_config.hwinfo_sudo_user | default('') }}"
      when: station_config.hwinfo_enabled | default(false) | bool
    - role: guardian
      guardian_enabled: "{{ station_config.guardian_enabled | default(false) }}"
      guardian_git_enabled: "{{ station_config.guardian_git_enabled | default(false) }}"
      guardian_provider: "{{ station_config.guardian_provider | default('codex') }}"
      guardian_station_id: "{{ station_config.guardian_station_id | default(station_id) }}"
      guardian_relay_url: "{{ station_config.guardian_relay_url | default('') }}"
      when: >-
        station_config.guardian_enabled | default(false) | bool or
        guardian_opt_dir.stat.exists or guardian_etc_dir.stat.exists or
        guardian_unit_file.stat.exists or guardian_var_dir.stat.exists
