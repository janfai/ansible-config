---
- name: Správa stanice Linux Mint
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars_files:
    - group_vars/mint.yml
  vars:
    station_id: "{{ station_id_content.content | b64decode | trim }}"
  pre_tasks:
    - name: Zjistit přítomnost identity stanice
      ansible.builtin.stat:
        path: /etc/ansible/station-id
      register: station_id_file

    - name: Ověřit přítomnost identity stanice
      ansible.builtin.assert:
        that:
          - station_id_file.stat.exists
        fail_msg: Chybí /etc/ansible/station-id; nejprve spusťte bootstrap.sh <id>.

    - name: Načíst identitu stanice
      ansible.builtin.slurp:
        src: /etc/ansible/station-id
      register: station_id_content

    - name: Ověřit, že cílový systém je Linux Mint
      ansible.builtin.assert:
        that:
          - ansible_distribution == 'Linux Mint'
        fail_msg: Tato konfigurace je určena pouze pro Linux Mint.

    - name: Ověřit identitu stanice
      ansible.builtin.assert:
        that:
          - station_id in station_ids
        fail_msg: Identita stanice chybí nebo není povolená.

    - name: Načíst konfiguraci stanice
      ansible.builtin.include_vars:
        file: "host_vars/{{ station_id }}.yml"
        name: station_config

    - name: Načíst šifrovaná tajemství stanice
      ansible.builtin.set_fact:
        station_secrets: >-
          {{ lookup(
            'community.sops.sops',
            playbook_dir ~ '/secrets/' ~ station_id ~ '.enc.yaml',
            input_type='yaml',
            output_type='yaml'
          ) | from_yaml }}
      no_log: true

    - name: Ověřit povinná tajemství
      ansible.builtin.assert:
        that:
          - station_secrets.SMTP_RELAY_HOST is defined
          - station_secrets['SMTP_PASS_' ~ (station_id | upper | replace('-', '_'))] is defined
          - station_secrets.USER_EMAIL is defined
          - station_secrets.ADMIN_EMAIL is defined
          - station_secrets.SMTP_ACCOUNT is defined
          - station_secrets.ADMIN_SIGNATURE is defined
        fail_msg: Šifrovaný soubor stanice neobsahuje všechna povinná pole.
      no_log: true
  roles:
    - common
    - sops_client
    - mail
    - smartd
    - reporting
    - inventory
