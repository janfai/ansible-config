---
- name: Znovu načíst aliasy pošty
  ansible.builtin.command:
    argv:
      - newaliases
  changed_when: true

- name: Zkontrolovat konfiguraci Postfixu
  ansible.builtin.command:
    argv:
      - postfix
      - check
  changed_when: false

- name: Restartovat Postfix
  ansible.builtin.service:
    name: postfix
    state: restarted
    enabled: true
