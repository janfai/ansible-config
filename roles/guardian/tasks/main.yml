---
- name: Ověřit povolení legacy relay autentizace
  ansible.builtin.assert:
    that:
      - not (station_config.guardian_relay_legacy_auth | default(false) | bool) or guardian_station_id == guardian_legacy_station_id
    fail_msg: Legacy relay autentizace je povolena pouze pro stanici lada.
  when: guardian_enabled | bool

- name: Načíst tajemství Guardiana stanice
  ansible.builtin.set_fact:
    guardian_secrets: >-
      {{ lookup('community.sops.sops', playbook_dir ~ '/host_vars/' ~ station_id ~ '.sops.yaml',
      input_type='yaml', output_type='yaml') | from_yaml }}
  no_log: true
  when: guardian_enabled | bool

- name: Ověřit nastavení Guardiana
  ansible.builtin.assert:
    that:
      - guardian_provider in ['codex', 'claude']
      - guardian_station_id | length > 0
      - (guardian_relay_url | default(guardian_secrets.relay_url, true)) is match('^https://')
    fail_msg: Nastavení Guardiana je neúplné nebo neplatné.
  when: guardian_enabled | bool

- name: Ověřit tajemství Guardiana
  ansible.builtin.assert:
    that:
      - guardian_secrets.hmac_key is defined
      - guardian_secrets.hmac_key | length >= 32
      - guardian_secrets.allowed_signers is defined
      - guardian_secrets.allowed_signers | length > 0
    fail_msg: Šifrovaný soubor stanice nemá požadovaný HMAC klíč a allowed_signers.
  no_log: true
  when: guardian_enabled | bool

- name: Ověřit odlišnost HMAC klíče od legacy klíče
  ansible.builtin.assert:
    that:
      - guardian_legacy_hmac_key | length == 0 or guardian_hmac_key != guardian_legacy_hmac_key
    fail_msg: HMAC klíč stanice se shoduje s legacy klíčem.
  no_log: true
  when: guardian_enabled | bool

- name: Vytvořit systémový účet Guardiana
  ansible.builtin.user:
    name: guardian-agent
    home: "{{ guardian_home }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false
    state: present
  when: guardian_enabled | bool

- name: Vytvořit adresáře Guardiana
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: /opt/upgrade-guardian, owner: root, group: root, mode: '0755'}
    - {path: /etc/upgrade-guardian, owner: root, group: root, mode: '0750'}
    - {path: /var/lib/upgrade-guardian, owner: guardian-agent, group: guardian-agent, mode: '0700'}
    - {path: "{{ guardian_home }}", owner: guardian-agent, group: guardian-agent, mode: '0700'}
    - {path: "{{ guardian_codex_home }}", owner: guardian-agent, group: guardian-agent, mode: '0700'}
    - {path: /var/lib/upgrade-guardian/repo, owner: root, group: root, mode: '0755'}
    - {path: /var/lib/upgrade-guardian/repo/tasks/pending, owner: root, group: root, mode: '0755'}
    - {path: /var/lib/upgrade-guardian/repo/results, owner: root, group: root, mode: '0755'}
    - {path: /var/lib/upgrade-guardian/repo/hb, owner: root, group: root, mode: '0755'}
  when: guardian_enabled | bool

- name: Připravit Git mailbox Guardiana
  ansible.builtin.include_tasks: git-mailbox.yml
  when: guardian_enabled | bool and guardian_git_enabled | bool

- name: Ověřit manifest vendorované runtime kopie
  ansible.builtin.command:
    argv:
      - sha256sum
      - --check
      - MANIFEST
  args:
    chdir: "{{ role_path }}/files"
  changed_when: false
  when: guardian_enabled | bool

- name: Zkopírovat runtime Guardiana
  ansible.builtin.copy:
    src: guardian
    dest: /opt/upgrade-guardian/guardian
    owner: root
    group: root
    mode: '0755'
  notify: Restartovat Guardiana
  when: guardian_enabled | bool

- name: Nainstalovat ověřenou binárku Codex CLI
  when: guardian_enabled | bool and guardian_provider == 'codex'
  block:
    - name: Stáhnout připnutý archiv Codex CLI
      ansible.builtin.get_url:
        url: https://github.com/openai/codex/releases/download/rust-v0.164.0/codex-x86_64-unknown-linux-musl.tar.gz
        dest: /opt/upgrade-guardian/codex.tar.gz
        checksum: sha256:90dd0b03b28afcb7fa733a4f73b413db2916a47347efd43fb669cc1c774ee8e4
        mode: '0644'

    - name: Vytvořit adresář binárky Codex
      ansible.builtin.file:
        path: "{{ guardian_home }}/.local/bin"
        state: directory
        owner: guardian-agent
        group: guardian-agent
        mode: '0755'

    - name: Rozbalit Codex CLI
      ansible.builtin.unarchive:
        src: /opt/upgrade-guardian/codex.tar.gz
        dest: /opt/upgrade-guardian
        remote_src: true

    - name: Instalovat Codex CLI
      ansible.builtin.copy:
        src: /opt/upgrade-guardian/codex-x86_64-unknown-linux-musl
        dest: "{{ guardian_home }}/.local/bin/codex"
        remote_src: true
        owner: guardian-agent
        group: guardian-agent
        mode: '0755'

    - name: Ověřit připnutou verzi Codex CLI
      ansible.builtin.command: '"{{ guardian_home }}/.local/bin/codex" --version'
      register: guardian_codex_version_check
      changed_when: false
      failed_when: "guardian_codex_version_check.rc != 0 or '0.164.0' not in guardian_codex_version_check.stdout"

- name: Zapsat veřejný klíč mastera pro ověřování podpisů
  ansible.builtin.copy:
    dest: /etc/upgrade-guardian/allowed_signers
    content: "{{ guardian_allowed_signers | trim }}\nrouter namespaces=\"guardian-board\" {{ guardian_allowed_signers | regex_search('ssh-ed25519 [A-Za-z0-9+/=]+') }}\n"
    owner: root
    group: root
    mode: '0644'
  when: guardian_enabled | bool

- name: Zapsat HMAC klíč stanice
  ansible.builtin.copy:
    dest: /etc/upgrade-guardian/station.key
    content: "{{ guardian_hmac_key | trim }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: guardian_enabled | bool

- name: Zapsat konfiguraci Guardiana
  notify: Restartovat Guardiana
  no_log: true
  ansible.builtin.copy:
    dest: /etc/upgrade-guardian/config.json
    content: "{{ guardian_config | to_nice_json }}\n"
    owner: root
    group: root
    mode: '0640'
  vars:
    guardian_config:
      id: "{{ guardian_station_id }}"
      signer: "{{ guardian_signer }}"
      repo: /var/lib/upgrade-guardian/repo
      host_key: /etc/upgrade-guardian/station_ed25519
      last_git_sync: never
      relay_url: "{{ guardian_relay_url | default(guardian_secrets.relay_url, true) }}"
      relay_key_file: /etc/upgrade-guardian/station.key
      agent_provider: "{{ guardian_provider }}"
      agent_profile: temporary
      agent_workdir: /var/lib/upgrade-guardian/agent-work
      codex_home: "{{ guardian_codex_home }}"
      camouflage: false
      relay_legacy_auth: "{{ station_config.guardian_relay_legacy_auth | default(false) }}"
  when: guardian_enabled | bool

- name: Instalovat systemd unit Guardiana
  ansible.builtin.copy:
    src: upgrade-guardian.service
    dest: /etc/systemd/system/upgrade-guardian.service
    owner: root
    group: root
    mode: '0644'
  notify: Restartovat Guardiana
  when: guardian_enabled | bool

- name: Povolit a spustit Guardiana
  ansible.builtin.systemd:
    name: upgrade-guardian.service
    enabled: true
    state: started
    daemon_reload: true
  when: guardian_enabled | bool

- name: Zjistit dostupnost Codex CLI před retire
  ansible.builtin.stat:
    path: "{{ guardian_home }}/.local/bin/codex"
  register: guardian_retire_codex
  when: not (guardian_enabled | bool)

- name: Odhlásit Codex před odstraněním profilu
  ansible.builtin.command:
    argv:
      - "{{ guardian_home }}/.local/bin/codex"
      - logout
  become: true
  become_user: guardian-agent
  environment:
    HOME: "{{ guardian_home }}"
    CODEX_HOME: "{{ guardian_codex_home }}"
  no_log: true
  when: not (guardian_enabled | bool) and guardian_retire_codex.stat.exists

- name: Zakázat a zastavit dřívější Guardian
  ansible.builtin.systemd:
    name: upgrade-guardian.service
    enabled: false
    state: stopped
  failed_when: false
  when: not (guardian_enabled | bool)

- name: Odstranit unit Guardiana
  ansible.builtin.file:
    path: /etc/systemd/system/upgrade-guardian.service
    state: absent
  when: not (guardian_enabled | bool)

- name: Znovu načíst systemd po odstranění unitu
  ansible.builtin.systemd:
    daemon_reload: true
  when: not (guardian_enabled | bool)

- name: Zastavit procesy účtu Guardiana před odstraněním
  ansible.builtin.command:
    argv:
      - pkill
      - -KILL
      - -u
      - guardian-agent
  register: guardian_kill_result
  changed_when: guardian_kill_result.rc == 0
  failed_when: false
  when: not (guardian_enabled | bool)

- name: Odstranit soubory a profily Guardiana
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /opt/upgrade-guardian
    - /etc/upgrade-guardian
    - /var/lib/upgrade-guardian
  when: not (guardian_enabled | bool)

- name: Odstranit účet Guardiana
  ansible.builtin.user:
    name: guardian-agent
    state: absent
    remove: false
  when: not (guardian_enabled | bool)
