- name: Načíst tajemství Guardiana přes home-nas bez lokálního SOPS klíče
  ansible.builtin.set_fact:
    guardian_secrets: "{{ lookup('guardian_sops_remote', playbook_dir ~ '/host_vars/' ~ station_id ~ '.sops.yaml') | from_yaml }}"
  no_log: true
  when:
    - guardian_secrets is not defined
    - guardian_enabled | bool
    - guardian_station_id == 'home-laptop'

- name: Načíst tajemství Guardiana ostatních stanic přes community.sops
  ansible.builtin.set_fact:
    guardian_secrets: >-
      {{ lookup('community.sops.sops', playbook_dir ~ '/host_vars/' ~ station_id ~ '.sops.yaml',
      input_type='yaml', output_type='yaml') | from_yaml }}
  no_log: true
  when:
    - guardian_secrets is not defined
    - guardian_enabled | bool
    - guardian_station_id != 'home-laptop'
