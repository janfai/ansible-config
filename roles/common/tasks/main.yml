---
- name: Read active swap block devices
  ansible.builtin.command:
    argv:
      - awk
      - 'NR > 1 && substr($1, 1, 5) == "/dev/" { print $1 }'
      - /proc/swaps
  register: resume_swap_devices
  changed_when: false
  check_mode: false

- name: Read UUIDs of active swap block devices
  ansible.builtin.command:
    argv:
      - blkid
      - -s
      - UUID
      - -o
      - value
      - "{{ item }}"
  loop: "{{ resume_swap_devices.stdout_lines }}"
  register: resume_swap_uuid_results
  changed_when: false
  failed_when: false
  check_mode: false

- name: Collect active swap UUIDs
  ansible.builtin.set_fact:
    resume_active_swap_uuids: >-
      {{ resume_swap_uuid_results.results
         | selectattr('rc', 'equalto', 0)
         | map(attribute='stdout')
         | reject('equalto', '')
         | unique
         | list }}
  changed_when: false

- name: Check for an existing initramfs resume configuration
  ansible.builtin.stat:
    path: /etc/initramfs-tools/conf.d/resume
  register: resume_configuration

- name: Read the current initramfs resume configuration
  ansible.builtin.slurp:
    src: /etc/initramfs-tools/conf.d/resume
  register: resume_configuration_content
  when: resume_configuration.stat.exists

- name: Parse configured resume UUIDs and setting presence
  ansible.builtin.set_fact:
    resume_configured_uuids: >-
      {{ (resume_configuration_content.content | b64decode | regex_findall('(?m)^RESUME=UUID=([A-Fa-f0-9-]+)')) }}
    resume_setting_present: >-
      {{ (resume_configuration_content.content | b64decode | regex_findall('(?m)^RESUME=')) | length > 0 }}
  changed_when: false
  when: resume_configuration.stat.exists

- name: Replace stale initramfs resume UUID with an active swap UUID
  ansible.builtin.lineinfile:
    path: /etc/initramfs-tools/conf.d/resume
    regexp: '^RESUME='
    line: "RESUME=UUID={{ resume_active_swap_uuids | first }}"
    owner: root
    group: root
    mode: '0644'
  when:
    - resume_configuration.stat.exists
    - resume_setting_present
    - resume_active_swap_uuids | length > 0
    - resume_configured_uuids | intersect(resume_active_swap_uuids) | length == 0
  notify: Regenerate initramfs after resume config change

- name: Remove initramfs resume configuration without an active swap UUID
  ansible.builtin.file:
    path: /etc/initramfs-tools/conf.d/resume
    state: absent
  when:
    - resume_configuration.stat.exists
    - resume_setting_present
    - resume_active_swap_uuids | length == 0
  notify: Regenerate initramfs after resume config change

- name: Instalovat ověřovací wrapper ansible-pull
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/bin/ansible-pull-verified"
    dest: /usr/local/sbin/ansible-pull-verified
    owner: root
    group: root
    mode: '0755'

- name: Instalovat podepisování ověřující systemd service
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/systemd/ansible-pull.service"
    dest: /etc/systemd/system/ansible-pull.service
    owner: root
    group: root
    mode: '0644'
  notify: Načíst systemd

- name: Nainstalovat základní balíčky navíc proti čistému Mintu
  ansible.builtin.apt:
    name: "{{ mint_base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Zajistit české prostředí
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?cs_CZ.UTF-8 UTF-8$'
    line: cs_CZ.UTF-8 UTF-8
    create: true
    owner: root
    group: root
    mode: '0644'
  notify: Vygenerovat české prostředí

- name: Nastavit české výchozí prostředí
  ansible.builtin.command:
    argv:
      - update-locale
      - "LANG={{ mint_locale }}"
  changed_when: false

- name: Zjistit časové pásmo
  ansible.builtin.command:
    argv:
      - timedatectl
      - show
      - --property=Timezone
      - --value
  register: timezone_current
  changed_when: false

- name: Nastavit časové pásmo
  ansible.builtin.command:
    argv:
      - timedatectl
      - set-timezone
      - "{{ mint_timezone }}"
  when: timezone_current.stdout != mint_timezone

- name: Zjistit základní vydání Ubuntu této stanice
  ansible.builtin.command:
    argv:
      - awk
      - -F=
      - '$1 == "UBUNTU_CODENAME" {gsub(/"/, "", $2); print $2}'
      - /etc/os-release
  register: ubuntu_codename
  changed_when: false

- name: Omezit automatické aktualizace na bezpečnostní opravy
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: '0644'

- name: Zapnout pravidelné hledání a instalaci bezpečnostních oprav
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: "APT::Periodic::Update-Package-Lists \"1\";\nAPT::Periodic::Unattended-Upgrade \"1\";\n"
    owner: root
    group: root
    mode: '0644'

- name: Upozornit při nedostatku místa v boot oddílu
  ansible.builtin.shell: |
    set -euo pipefail
    used="$(df -P /boot | awk 'NR == 2 {sub(/%/, "", $5); print $5}')"
    if [ "${used}" -ge "{{ boot_warning_percent }}" ]; then
      logger -p user.warning -t ansible-common "Oddíl /boot je zaplněn z ${used} procent."
    fi
  args:
    executable: /bin/bash
  changed_when: false

- name: Zjistit nainstalované balíčky
  ansible.builtin.package_facts:
    manager: auto

- name: Zjistit, zda je dostupný Timeshift
  ansible.builtin.command:
    argv:
      - timeshift
      - --list
  register: timeshift_check
  failed_when: false
  changed_when: false
  when: "'timeshift' in ansible_facts.packages"

- name: Zaznamenat nedostupný Timeshift nebo chybějící snímky
  ansible.builtin.command:
    argv:
      - logger
      - -p
      - user.warning
      - -t
      - ansible-common
      - Timeshift není nainstalovaný nebo nemá dostupné snímky.
  changed_when: false
  when: "'timeshift' not in ansible_facts.packages or timeshift_check.rc != 0 or 'No snapshots found' in timeshift_check.stdout"
