---
- name: Načíst systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Vygenerovat české prostředí
  ansible.builtin.command:
    argv:
      - locale-gen
      - cs_CZ.UTF-8
  changed_when: true

- name: Regenerate initramfs after resume config change
  ansible.builtin.command:
    argv:
      - update-initramfs
      - -u
  changed_when: true
