---
- name: Obnovit stabilní repozitář TeamVieweru
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/teamviewer.list
    content: "deb [signed-by=/usr/share/keyrings/teamviewer-keyring.gpg] https://linux.teamviewer.com/deb stable main\n"
    owner: root
    group: root
    mode: '0644'
  register: teamviewer_repository
  when: teamviewer_enabled | bool

- name: Obnovit indexy po změně repozitáře TeamVieweru
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  when:
    - teamviewer_enabled | bool
    - teamviewer_repository.changed
    - not ansible_check_mode

- name: Nainstalovat TeamViewer, pokud chybí
  ansible.builtin.apt:
    name: teamviewer
    state: present
    update_cache: true
    cache_valid_time: 3600
  when:
    - teamviewer_enabled | bool
    - not ansible_check_mode

- name: Povolit aktualizace TeamVieweru přes unattended-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/52teamviewer-unattended-upgrades
    content: |
      Unattended-Upgrade::Origins-Pattern:: "origin=TeamViewer GmbH,label=TeamViewer";

    owner: root
    group: root
    mode: '0644'
  when: teamviewer_enabled | bool

- name: Zapnout a spustit službu TeamVieweru
  ansible.builtin.systemd:
    name: teamviewerd.service
    enabled: true
    state: started
  when: teamviewer_enabled | bool
