---
- name: Ověřit cílovou stanici TeamVieweru
  ansible.builtin.assert:
    that:
      - station_id == 'lada'
    fail_msg: Role TeamVieweru je povolena pouze pro stanici lada.
  when: teamviewer_enabled | bool

- name: Obnovit stabilní repozitář TeamVieweru
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/teamviewer.list
    content: "deb [signed-by=/usr/share/keyrings/teamviewer-keyring.gpg] https://linux.teamviewer.com/deb stable main\n"
    owner: root
    group: root
    mode: '0644'
  register: teamviewer_repository
  when: teamviewer_enabled | bool

- name: Aktualizovat indexy po změně repozitáře TeamVieweru
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  changed_when: false
  when:
    - teamviewer_enabled | bool
    - teamviewer_repository.changed
    - not ansible_check_mode

- name: Zajistit instalaci TeamVieweru
  ansible.builtin.apt:
    name: teamviewer
    state: present
  when: teamviewer_enabled | bool

- name: Zapnout a spustit službu TeamVieweru
  ansible.builtin.systemd:
    name: teamviewerd.service
    enabled: true
    state: started
  when: teamviewer_enabled | bool
