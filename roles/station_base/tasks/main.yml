---
- name: Zjistit stav balíčků časových služeb
  ansible.builtin.command:
    argv:
      - dpkg-query
      - -W
      - -f
      - '${db:Status-Abbrev}'
      - "{{ item }}"
  loop: "{{ station_base_conflicting_time_packages }}"
  register: station_base_time_package_state
  changed_when: false
  failed_when: false
  check_mode: false

- name: Odstranit konkurenční časové služby včetně konfigurace
  ansible.builtin.apt:
    name: "{{ item.item }}"
    state: absent
    purge: true
  loop: "{{ station_base_time_package_state.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0 and (item.stdout | trim) is match('^(ii|rc|hi|ri)')

- name: Zajistit systemd-timesyncd
  ansible.builtin.apt:
    name: systemd-timesyncd
    state: present

- name: Zapnout a spustit systemd-timesyncd
  ansible.builtin.systemd:
    name: systemd-timesyncd.service
    enabled: true
    state: started

- name: Zjistit jednotku casper-md5check
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/casper-md5check.service
  register: station_base_casper_unit

- name: Zakázat kontrolu Live ISO na nainstalované stanici
  ansible.builtin.systemd:
    name: casper-md5check.service
    enabled: false
    masked: true
  when: station_base_casper_unit.stat.exists

- name: Najít opuštěné SysV odkazy po ntp
  ansible.builtin.command:
    argv: "{{ ['find'] + station_base_sysv_rc_dirs + ['-maxdepth', '1', '-xtype', 'l', '-name', station_base_sysv_links_glob] }}"
  register: station_base_orphan_links
  changed_when: false
  check_mode: false

- name: Odstranit opuštěné SysV odkazy po ntp
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ station_base_orphan_links.stdout_lines }}"

- name: Odstranit zastaralé a nežádoucí balíčky
  ansible.builtin.apt:
    name: "{{ station_base_obsolete_packages }}"
    state: absent
    purge: true


- name: Zjistit nebalíčková stará pravidla udev
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ station_base_legacy_udev_rules }}"
  register: station_base_udev_stat

- name: Zjistit, zda pravidlo udev patří balíčku
  ansible.builtin.command:
    argv:
      - dpkg
      - -S
      - "{{ item.item }}"
  loop: "{{ station_base_udev_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  register: station_base_udev_owner
  changed_when: false
  failed_when: false
  check_mode: false
  when: item.stat.exists

- name: Vytvořit adresář záloh pravidel udev
  ansible.builtin.file:
    path: "{{ station_base_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  when: station_base_udev_owner.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | list | length > 0

- name: Zálohovat nebalíčková stará pravidla udev
  ansible.builtin.copy:
    src: "{{ item.item.item }}"
    dest: "{{ station_base_backup_dir }}/{{ item.item.item | basename }}"
    remote_src: true
    owner: root
    group: root
    mode: '0600'
    force: false
  loop: "{{ station_base_udev_owner.results }}"
  loop_control:
    label: "{{ item.item.item | default('') }}"
  when: item.rc is defined and item.rc != 0

- name: Odsunout nebalíčková stará pravidla udev
  ansible.builtin.file:
    path: "{{ item.item.item }}"
    state: absent
  loop: "{{ station_base_udev_owner.results }}"
  loop_control:
    label: "{{ item.item.item | default('') }}"
  when: item.rc is defined and item.rc != 0
  notify: Znovu načíst pravidla udev

- name: Zjistit nainstalované balíčky stanice
  ansible.builtin.package_facts:
    manager: auto

- name: Zjistit zapnutí SSH přes socket nebo službu
  ansible.builtin.command:
    argv:
      - systemctl
      - is-enabled
      - ssh.socket
      - ssh.service
  register: station_base_ssh_enabled
  changed_when: false
  failed_when: false
  check_mode: false
  when: "'openssh-server' in ansible_facts.packages"

- name: Zapnout SSH, pokud není zapnuté ani socketem
  ansible.builtin.systemd:
    name: ssh.service
    enabled: true
  when:
    - "'openssh-server' in ansible_facts.packages"
    - "'enabled' not in station_base_ssh_enabled.stdout_lines"

- name: Zajistit běh SSH
  ansible.builtin.systemd:
    name: ssh.service
    state: started
  when: "'openssh-server' in ansible_facts.packages"

- name: Zajistit služby nainstalovaných balíčků
  ansible.builtin.systemd:
    name: "{{ item.unit }}"
    enabled: true
    state: started
  loop: "{{ station_base_services }}"
  loop_control:
    label: "{{ item.unit }}"
  when: item.package in ansible_facts.packages

- name: Prověřit bezpečné odstranění volitelných balíčků
  ansible.builtin.command:
    argv:
      - bash
      - -c
      - |
        set -o pipefail
        config_status=none
        for directory in /etc/openvpn/client /etc/openvpn/server; do
          if [ -d "$directory" ]; then
            if config_file=$(find "$directory" -name '*.conf' -print -quit); then
              if [ -n "$config_file" ]; then config_status=found; break; fi
            else
              config_status=unknown
              break
            fi
          fi
        done
        if command -v nmcli >/dev/null 2>&1; then
          if connection_types=$(nmcli -t -f TYPE connection show); then
            if printf '%s\n' "$connection_types" | grep -Fxq vpn; then vpn=yes; else vpn=no; fi
          else
            vpn=unknown
          fi
        else
          vpn=unknown
        fi
        if command -v pgrep >/dev/null 2>&1; then
          if pgrep -x openvpn >/dev/null 2>&1; then
            process=yes
          else
            result=$?
            if [ "$result" -eq 1 ]; then process=no; else process=unknown; fi
          fi
        else
          process=unknown
        fi
        printf 'conf=%s\nvpn=%s\nprocess=%s\n' "$config_status" "$vpn" "$process"
  register: station_base_openvpn_safety
  changed_when: false
  check_mode: false
  when: station_base_absent_packages | length > 0

- name: Odstranit volitelné balíčky bez aktivní konfigurace OpenVPN
  ansible.builtin.apt:
    name: "{{ station_base_absent_packages }}"
    state: absent
    purge: true
    autoremove: false
  when:
    - station_base_absent_packages | length > 0
    - "'conf=none' in station_base_openvpn_safety.stdout_lines"
    - "'vpn=no' in station_base_openvpn_safety.stdout_lines"
    - "'process=no' in station_base_openvpn_safety.stdout_lines"

- name: Upozornit na vynechané odstranění volitelných balíčků
  ansible.builtin.debug:
    msg: >-
      Balíčky {{ station_base_absent_packages | join(', ') }} nebyly odstraněny:
      pojistka OpenVPN není splněna ({{ station_base_openvpn_safety.stdout_lines | join('; ') }}).
  when:
    - station_base_absent_packages | length > 0
    - >-
      'conf=none' not in station_base_openvpn_safety.stdout_lines or
      'vpn=no' not in station_base_openvpn_safety.stdout_lines or
      'process=no' not in station_base_openvpn_safety.stdout_lines
