---
- name: Správa permanentního Guardiana na home-laptop
  hosts: localhost
  connection: local
  become: true
  gather_facts: true
  vars:
    station_id: home-laptop
    guardian_gate_enrollment_enabled: false
    guardian_gate_enroll_bin: "{{ lookup('env', 'HOME') }}/Work/bin/guardian-git-enroll"
    guardian_gate_master_public_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519.pub"
  pre_tasks:
    - name: Ověřit cílový Omarchy host
      ansible.builtin.assert:
        that:
          - ansible_hostname == 'home-laptop'
          - ansible_distribution == 'Archlinux'
        fail_msg: Tento vstupní bod je určen pouze pro home-laptop s Arch Linuxem.

    - name: Načíst profil home-laptop
      ansible.builtin.include_vars:
        file: host_vars/home-laptop.yml
        name: station_config

  roles:
    - role: guardian
      guardian_enabled: "{{ station_config.guardian_enabled | bool }}"
      guardian_git_enabled: "{{ station_config.guardian_git_enabled | bool }}"
      guardian_provider: "{{ station_config.guardian_provider | default('none') }}"
      guardian_mode: "{{ station_config.guardian_mode | default('temporary') }}"
      guardian_camouflage: "{{ station_config.guardian_camouflage | default(false) | bool }}"
      guardian_station_id: "{{ station_config.guardian_station_id | default(station_id) }}"
      guardian_relay_url: "{{ station_config.guardian_relay_url | default('') }}"
  tasks:
    - name: Idempotentně zaregistrovat Git Gate po úspěšném nasazení stanice
      ansible.builtin.command:
        argv:
          - "{{ guardian_gate_enroll_bin }}"
          - --id
          - "{{ station_config.guardian_station_id | default(station_id) }}"
          - --station
          - "{{ station_config.guardian_ssh_target }}"
          - --master-key
          - "{{ guardian_gate_master_public_key }}"
          - --master-name
          - home-laptop
          - --ssh-option
          - StrictHostKeyChecking=yes
      register: guardian_gate_enroll_result
      changed_when: (guardian_gate_enroll_result.stdout | from_json).added_keys | int > 0
      when: guardian_gate_enrollment_enabled | bool
